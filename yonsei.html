<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="PNU tES Yonsei: 점검 and 실험 control for the tES board (Web Bluetooth).">
<title>tES Yonsei</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
/* Layout: one phone-width app column (the real app), centred; light theme only (decided 2026-11-21). */
:root{
  --bg:#eef1f2; --panel:#ffffff; --ink:#1b2326; --muted:#5d6a6f; --line:#d5dcde; --grid:#e6eaeb;
  --accent:#0f766e; --accent-soft:#d7efec; --ok:#15803d; --warn:#b45309; --warn-soft:#fdf0d8;
  --stop:#c62828; --live:#1d4ed8; --live-soft:#dde7fd; --wave:#1d4ed8;
  --sans:system-ui,-apple-system,"Noto Sans KR",sans-serif; --mono:ui-monospace,"Roboto Mono",monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.app{max-width:420px;margin:0 auto;min-height:100%;background:var(--panel);display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.status{display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line);font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.state{margin-left:auto;font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.state.run{background:var(--live);color:#fff}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.tabs button{all:unset;text-align:center;padding:12px 0;font-size:16px;color:var(--muted);cursor:pointer}
.tabs button.on{color:var(--accent);font-weight:700;box-shadow:inset 0 -2px 0 var(--accent)}
main{flex:1;padding-block:12px 12px;display:grid;gap:10px;align-content:start}
.menu{display:grid;gap:10px;grid-template-rows:repeat(4,84px)}
.item{all:unset;cursor:pointer;display:grid;grid-template-columns:40px 1fr 18px;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:0 16px;font-size:17px}
.item:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{width:38px;height:38px;font-size:16px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-family:var(--mono)}
.item b{display:block}
.item small{color:var(--muted);font-size:12.5px}
.arrow{color:var(--muted);font-size:22px}
.back{all:unset;cursor:pointer;color:var(--accent);font-size:15px}
h2{font-size:1.2rem;margin:0}
.lbl{font-size:13px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;font-size:15px;padding:7px 13px;border:1px solid var(--line);border-radius:7px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip[disabled]{opacity:.4;cursor:default}
.scope{border:1px solid var(--line);border-radius:12px;padding:10px}
.scope svg{width:100%;height:auto;display:block}
.scope text{font-size:11px;fill:var(--muted);font-family:var(--mono)}
.readout{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13.5px;margin-top:6px}
.readout b{font-family:var(--mono);font-weight:500}
.prog{display:grid;gap:4px}
.bursts{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.bursts i{height:12px;border-radius:3px;background:var(--grid)}
.bursts i.done{background:var(--wave)}
.look{border-top:1px solid var(--line);padding-top:10px}
.look ul{margin:4px 0 0;padding-left:18px;display:grid;gap:3px;font-size:13.5px}
.btn{all:unset;cursor:pointer;display:block;text-align:center;font-weight:700;font-size:16px;padding:14px;border-radius:12px;background:var(--accent);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.note{font-size:12.5px;color:var(--muted)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px}
.stop{all:unset;cursor:pointer;background:var(--stop);color:#fff;text-align:center;font-weight:700;letter-spacing:.05em;font-size:17px;padding-block:16px;position:sticky;bottom:0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{all:unset;cursor:pointer;text-align:center;padding:10px 0;font-size:15px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}
.seg button[disabled]{opacity:.45;cursor:default}
.now{display:flex;align-items:baseline;gap:14px;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.now .id{font-family:var(--mono);font-size:44px;line-height:1;color:var(--accent)}
.now .cond{font-size:18px;font-weight:700}
.now .cond small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.steps{display:grid;gap:6px}
.step{all:unset;cursor:pointer;text-align:center;border:1px solid var(--line);border-radius:10px;padding:7px 0 6px;font-size:14px;line-height:1.25}
.step small{display:block;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.step.cur{border:2px solid var(--accent);background:var(--accent-soft);padding:6px 0 5px}
.step.done{background:var(--grid)}
.step.done small::after{content:" ✓";color:var(--ok)}
.step[disabled]{cursor:default}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line);font-size:15px;padding:10px}
.btn.big{font-size:19px;padding:12px}
.log{border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-height:132px;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6}
.log div{display:grid;grid-template-columns:42px 38px minmax(0,1fr) auto;gap:6px;white-space:nowrap}
.log div span{overflow:hidden;text-overflow:ellipsis}
.log .t{color:var(--muted)}
.log .x{color:var(--warn)}
.log.prev{cursor:pointer;max-height:none}
.loghead{display:flex;justify-content:space-between;align-items:baseline}
.loghead button{all:unset;cursor:pointer;color:var(--accent);font-size:13px}
.log.full{max-height:none;font-size:13px;line-height:2}
.log.full div{grid-template-columns:18px 68px 38px minmax(0,1fr) auto;gap:6px;border-bottom:1px solid var(--grid)}
.modal{position:fixed;inset:0;background:rgba(20,28,30,.35);display:grid;place-items:center;padding:16px;z-index:10}
.modal .box{background:var(--panel);border-radius:14px;padding:18px;width:min(320px,100%);display:grid;gap:16px;font-size:16px;text-align:center}
.log .lamp{width:12px;height:12px;border-radius:50%;align-self:center;justify-self:end;margin-right:4px}
.log .ok{color:var(--ok)} .log .low{color:var(--warn)} .log .none{color:var(--stop);font-weight:700} .log .stp{color:var(--muted)}
.log .sep{display:block;text-align:center;color:var(--muted);font-size:12px;border-bottom:1px dashed var(--line);margin:2px 0}
.loghead .acts{display:flex;gap:14px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px;display:flex;justify-content:space-between}
.who button b{font-family:var(--mono)}
.who button[disabled]{opacity:.45;cursor:default}
.edit{border:2px solid var(--accent);border-radius:12px;padding:12px;display:grid;gap:10px}
.edit input{font:inherit;font-size:22px;font-family:var(--mono);width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.meas{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.meas i{width:10px;height:10px;border-radius:50%}
.example{font-size:11.5px;color:var(--muted);text-align:center;padding:6px}
.connect{all:unset;cursor:pointer;margin-left:auto;background:var(--accent);color:#fff;font-weight:700;padding:6px 16px;border-radius:8px}
.grid{display:grid;grid-template-columns:44px repeat(6,1fr);gap:9px 7px;align-items:center}
.grid .gh{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:center;white-space:nowrap}
.grid .gh small{font-size:9px;margin-left:1px}
.cell{all:unset;cursor:pointer;height:clamp(36px, calc((100dvh - 510px) / 5), 66px);border:1px solid var(--line);border-radius:9px;text-align:center;font-size:13px;color:var(--ok);background:var(--panel)}
.cell.t1{background:var(--accent-soft);border-color:#9fd3cc}
.cell.done{background:var(--grid)}
.cell[disabled]{cursor:default}
.ref{all:unset;cursor:pointer;margin-left:auto;color:var(--accent);font-size:13px;border:1px solid var(--line);border-radius:7px;padding:3px 8px}
.wset{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.wset[disabled]{opacity:.5;cursor:default}
.wset b{color:var(--ink,inherit);font-weight:700}
.man{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.man label{display:grid;gap:6px}
.man input{font-size:20px;padding:10px;border:1px solid var(--line);border-radius:10px;width:100%;box-sizing:border-box}
.wset .chips{gap:6px}
.wset .chip{padding:6px 11px;font-size:14px}
.edit label{display:grid;gap:4px}
.xbar{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.xbar button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;color:var(--muted);white-space:nowrap}
.xbar button b{color:var(--ink)}
.xbar button[disabled]{opacity:.45;cursor:default}
.now2{all:unset;cursor:pointer;position:relative;display:grid;grid-template-columns:1fr 1fr;align-items:baseline;border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.now2 .cond{font-family:var(--mono);font-size:32px;font-weight:700;line-height:1.2;color:var(--accent);text-align:center}
.now2 .cond small{font-size:16px;font-weight:600;color:var(--muted)}
.now2 .mtag{position:absolute;top:2px;left:8px;font-size:11px;color:var(--warn)}
.cell.prev{background:#fbd5d0;border-color:#f0a59b;color:#b42318}
.cell.last{background:#e5484d;border-color:#b42318;color:#fff}
.cell.cur{box-shadow:inset 0 0 0 2px var(--accent)}
position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#1b2326;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;max-width:360px;z-index:20}
.toast[hidden]{display:none}
.stop[disabled]{opacity:.6}
</style>
<script src="./yonsei.js" defer></script>
</head>
<body>
<div class="app">
  <div class="status pad" id="status"></div>
  <div class="tabs"><button type="button" data-go="menu" id="tabC">점검</button><button type="button" data-go="exp" id="tabE">실험</button></div>
  <main class="pad" id="main"></main>
  <button class="stop pad" id="stop" type="button">STOP</button>
</div>
<div class="toast" id="toast" hidden></div>
</body>
</html>
